<!--
  Tarjeta que sale al pegar el enlace en WhatsApp, Telegram o redes sociales.

  Sin esto se comparte como un enlace pelado y nadie sabe que hay al otro lado.
  Las etiquetas van aqui, en el HTML de partida, y no desde JavaScript: quien
  genera la vista previa lee el HTML tal cual llega del servidor y no ejecuta
  nada, asi que cualquier etiqueta anadida despues no la ve.

  La imagen se declara con URL absoluta por el mismo motivo: varias de esas
  plataformas no resuelven rutas relativas.
-->

<meta property="og:site_name" content="Toppo">
<meta property="og:locale" content="es_ES">
<meta property="og:title" content="Toppo — Convocatorias de empleo público del BOE">
